## render.yaml — Render Blueprint
## Deploy both services from one repository.
## Docs: https://render.com/docs/blueprint-spec

services:
  # ── Express API Backend ──────────────────────────────────
  - type: web
    name: copo-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MISTRAL_API_KEY
        sync: false          # Paste your key in the Render dashboard
      - key: CLIENT_ORIGIN
        value: https://copohrly-client.onrender.com

  # ── React Frontend Static Site ───────────────────────────
  - type: web
    name: copo-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://copohrly-server.onrender.com
    routes:
      # SPA fallback — all paths serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
