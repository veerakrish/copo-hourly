services:
  # ── Express API Backend ──────────────────────────────────
  - type: web
    name: copohrly-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MISTRAL_API_KEY
        sync: false          # Set this in the Render Dashboard
      - key: CLIENT_ORIGIN
        value: https://copohrly-client.onrender.com

  # ── React Frontend (Fixed) ───────────────────────────
  - type: web
    name: copohrly-client
    env: static      # This tells Render it is a Static Site, not a Node server
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://copohrly-server.onrender.com
    routes:
      # SPA fallback — now valid because env: static is defined
      - type: rewrite
        source: /*
        destination: /index.html
