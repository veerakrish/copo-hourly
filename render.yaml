services:
  # ── Express API Backend ──────────────────────────────────
  - type: web
    name: copohrly-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free       # Required for the dynamic Node.js backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MISTRAL_API_KEY
        sync: false  # You will manually paste your Mistral key in the Render dashboard
      - key: CLIENT_ORIGIN
        value: https://copohrly-client.onrender.com

  # ── React Frontend (Final Fix) ───────────────────────────
  - type: web
    name: copohrly-client
    env: static      # This identifies it as a static site
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # NO 'plan: free' here — static sites are free by default
    envVars:
      - key: VITE_API_URL
        value: https://copohrly-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
